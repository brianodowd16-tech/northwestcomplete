# One-click deploy on Render: Dashboard → New → Blueprint → pick this repository.
# Secrets marked sync: false are typed into the Render dashboard, never committed.
services:
  - type: web
    name: stmichaels-fuel-draw
    runtime: node
    region: frankfurt
    plan: starter            # a paid plan is needed for the persistent disk below
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: orders
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/orders.json
      - key: PUBLIC_URL
        sync: false          # e.g. https://draw.stmichaelsgaa.ie
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
