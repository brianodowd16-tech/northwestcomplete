name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds against the live public catalogue; no secrets needed.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
