name: CI

on:
  push:
    branches: [main, prototype]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: round
          POSTGRES_PASSWORD: round
          POSTGRES_DB: round_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U round" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://round:round@localhost:5432/round_test
      DATABASE_URL: postgres://round:round@localhost:5432/round_test
      SESSION_SECRET: ci-only-session-secret-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @round/web build
