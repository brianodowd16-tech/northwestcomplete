name: Site monitor

# Every 6 hours: checks the live site, the www address, the SSL certificates
# and the payment notification endpoint. A failed run emails the repository
# owner, so problems like "certificate not trusted" are caught before customers see them.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check site, certificates and payment endpoint
        run: |
          fail=0
          for host in northwestcomplete.com www.northwestcomplete.com; do
            # Normal TLS verification: an untrusted or mismatched certificate fails here.
            code=$(curl -sS --max-time 20 -o /tmp/page.html -w '%{http_code}' -L "https://$host/" || echo "error")
            if [ "$code" != "200" ]; then echo "::error::https://$host/ returned $code"; fail=1; continue; fi
            grep -q 'Northwest Complete' /tmp/page.html || { echo "::error::https://$host/ does not look like the site"; fail=1; }
            end=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$host certificate valid for $days more days"
            [ "$days" -ge 14 ] || { echo "::error::$host certificate expires in $days days"; fail=1; }
          done
          # The payment notification endpoint must be alive (it answers GET with 405).
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://northwestcomplete.com/api/mypos-notify.php || echo error)
          [ "$code" = "405" ] || { echo "::error::mypos-notify.php returned $code (expected 405)"; fail=1; }
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://northwestcomplete.com/book-audit.html || echo error)
          [ "$code" = "200" ] || { echo "::error::book-audit.html returned $code"; fail=1; }
          exit $fail
